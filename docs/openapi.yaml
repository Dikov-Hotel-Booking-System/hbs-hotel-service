openapi: 3.1.0
info:
  title: Сервис отелей
  version: v0
servers:
- url: /
security:
- bearerAuth: []
paths:
  /api/hotels:
    get:
      tags:
      - hotel-controller
      summary: получение страницы отелей
      operationId: getHotels
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetHotelsApiResponse"
components:
  schemas:
    GetHotelsApiResponse:
      type: object
      properties:
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        total_elements:
          type: integer
          format: int64
        total_pages:
          type: integer
          format: int64
        hotels:
          type: array
          items:
            $ref: "#/components/schemas/HotelItemApiResponse"
      required:
      - hotels
      - page
      - size
      - total_elements
      - total_pages
    HotelItemApiResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        address:
          type: string
      required:
      - address
      - id
      - name
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
