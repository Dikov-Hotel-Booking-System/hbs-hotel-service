name: Branch rules

on:
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, edited]

permissions: {}

concurrency:
  group: branch-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Branch policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Validate pull request source
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$HEAD_BRANCH" != feature/?* || "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
            echo "::error::Open pull requests to master from a feature/<name> branch in this repository."
            exit 1
          fi
